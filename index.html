<style>
:root{
  --accent:#3f7ea6; --accent-ink:#ffffff;
  --good:#3f8f5f; --warn:#b9862c; --bad:#c14a3f;
  --bg:#f5f4f1; --surface:#ffffff; --surface-2:#edebe5; --raised:#ffffff;
  --ink:#1c1f24; --ink-2:#4b5158; --muted:#7d8290; --border:#e2e0da;
  --shadow: 0 1px 2px rgba(20,23,28,.06), 0 1px 1px rgba(20,23,28,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --accent:#68a6cf; --accent-ink:#0d1216;
    --good:#5fb37e; --warn:#dcb15a; --bad:#e0776c;
    --bg:#12151a; --surface:#1a1e25; --surface-2:#212630; --raised:#242a34;
    --ink:#e9eaed; --ink-2:#b7bcc5; --muted:#7d8695; --border:#2a3038;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --accent:#68a6cf; --accent-ink:#0d1216;
  --good:#5fb37e; --warn:#dcb15a; --bad:#e0776c;
  --bg:#12151a; --surface:#1a1e25; --surface-2:#212630; --raised:#242a34;
  --ink:#e9eaed; --ink-2:#b7bcc5; --muted:#7d8695; --border:#2a3038;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
:root[data-theme="light"]{
  --accent:#3f7ea6; --accent-ink:#ffffff;
  --good:#3f8f5f; --warn:#b9862c; --bad:#c14a3f;
  --bg:#f5f4f1; --surface:#ffffff; --surface-2:#edebe5; --raised:#ffffff;
  --ink:#1c1f24; --ink-2:#4b5158; --muted:#7d8290; --border:#e2e0da;
  --shadow: 0 1px 2px rgba(20,23,28,.06), 0 1px 1px rgba(20,23,28,.04);
  color-scheme: light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; position:relative;}
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top);
}
.topbar-inner{padding:14px 18px 12px;}
.topbar-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.topbar h1{margin:0; font-size:22px; font-weight:800; letter-spacing:-0.01em; text-wrap:balance;}
.topbar .sub{margin-top:2px; font-size:12.5px; color:var(--muted); font-weight:500;}
.savebtn{
  flex:none; display:flex; align-items:center; gap:6px; margin-top:2px;
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:11px;
  padding:9px 13px; font:inherit; font-size:13px; font-weight:700; box-shadow:var(--shadow);
}
.savebtn svg{width:16px; height:16px;}
.savebtn:active{opacity:.85;}
.savebtn.saved{background:var(--good); color:#fff;}
.savebtn.failed{background:var(--bad); color:#fff;}
.storagebanner{
  margin-top:10px; font-size:12px; line-height:1.5; color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--border); border-radius:10px; padding:9px 11px;
}
.toast{
  position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  z-index:40; background:var(--ink); color:var(--bg); font-size:12.5px; font-weight:700;
  padding:9px 16px; border-radius:99px; box-shadow:0 4px 16px rgba(0,0,0,.25);
  opacity:0; transition:opacity .2s ease, transform .2s ease;
  max-width:calc(100% - 48px); text-align:center;
}
.toast.show{opacity:1;}
.databox{display:flex; gap:8px; flex-wrap:wrap;}
.databtn{
  flex:1; min-width:130px; display:flex; align-items:center; justify-content:center; gap:6px;
  border:1px solid var(--border); background:var(--raised); color:var(--ink); font:inherit;
  font-size:13px; font-weight:700; padding:11px 10px; border-radius:12px;
}
.databtn svg{width:16px; height:16px; color:var(--accent);}
.databtn:active{background:var(--surface-2);}
.savedstamp{font-size:11.5px; color:var(--muted); margin-top:8px;}
main{flex:1; padding:14px 16px calc(96px + env(safe-area-inset-bottom));}
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  max-width:520px; margin:0 auto;
  display:flex; background:color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbtn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; padding:6px 2px; color:var(--muted);
  font:inherit; font-size:10.5px; font-weight:600; letter-spacing:.01em;
  border-radius:12px;
}
.tabbtn svg{width:22px; height:22px;}
.tabbtn[aria-selected="true"]{color:var(--accent);}
.tabbtn:active{background:var(--surface-2);}

h2.eyebrow{
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
  color:var(--muted); margin:22px 0 10px;
}
h2.eyebrow:first-child{margin-top:2px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:14px 15px; box-shadow:var(--shadow);
}
.stack{display:flex; flex-direction:column; gap:10px;}
p.lede{color:var(--ink-2); font-size:14px; margin:2px 0 4px;}

.herochip{
  display:inline-flex; align-items:center; gap:6px; background:var(--surface-2);
  border:1px solid var(--border); color:var(--ink-2); font-size:12px; font-weight:600;
  padding:4px 10px; border-radius:99px; margin-bottom:12px;
}
.herochip .dot{width:6px; height:6px; border-radius:50%; background:var(--accent);}

.weekcard{position:relative;}
.weekcard.iscurrent{border-color:var(--accent);}
.weekrow{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.weekrow .wk{font-weight:800; font-size:15px;}
.weekrow .dates{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
.phasepill{
  display:inline-block; margin-top:6px; font-size:11.5px; font-weight:700;
  padding:3px 9px; border-radius:99px; background:var(--surface-2); color:var(--ink-2);
}
.kv{display:grid; grid-template-columns:64px 1fr; gap:4px 10px; margin-top:10px; font-size:13.5px;}
.kv .k{color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding-top:1px;}
.kv .v{color:var(--ink);}

.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -1px;}
table.grid{border-collapse:collapse; width:100%; min-width:520px; font-size:13px;}
table.grid th, table.grid td{
  text-align:left; padding:8px 10px; border-bottom:1px solid var(--border);
  white-space:nowrap; font-variant-numeric:tabular-nums;
}
table.grid th{color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
table.grid td:first-child, table.grid th:first-child{
  position:sticky; left:0; background:var(--surface); font-weight:700; color:var(--ink);
}

ul.bullets{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px;}
ul.bullets li{display:flex; gap:9px; font-size:13.5px; color:var(--ink-2);}
ul.bullets li::before{content:"•"; color:var(--accent); font-weight:800; flex:none;}
ol.rules{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:11px; counter-reset:rule;}
ol.rules li{display:flex; gap:10px; font-size:13.5px; color:var(--ink-2); counter-increment:rule;}
ol.rules li::before{
  content:counter(rule); flex:none; width:20px; height:20px; border-radius:50%;
  background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:800;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}

.accordion{border:1px solid var(--border); border-radius:16px; background:var(--surface); overflow:hidden; box-shadow:var(--shadow);}
.accordion + .accordion{margin-top:10px;}
.acc-head{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:none; border:none; padding:14px 15px; font:inherit; color:var(--ink); text-align:left;
}
.acc-head .title{font-weight:800; font-size:15px;}
.acc-head .meta{font-size:12px; color:var(--muted); font-weight:600; margin-top:2px;}
.acc-head .chev{width:18px; height:18px; color:var(--muted); transition:transform .18s ease; flex:none;}
.accordion.open .acc-head .chev{transform:rotate(90deg);}
.acc-body{max-height:0; overflow:hidden; transition:max-height .22s ease;}
.accordion.open .acc-body{max-height:none;}
.acc-body-inner{padding:0 13px 13px;}

.dayacc{margin-top:14px;}
.dayacc:first-child{margin-top:2px;}
.day-head{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:none; border:none; border-bottom:1px solid var(--border); padding:0 0 8px 2px; margin-bottom:8px;
  font:inherit; text-align:left;
}
.daylabel{
  font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent);
}
.daycount{font-size:11px; color:var(--muted); font-weight:600; margin-left:auto; margin-right:2px;}
.day-head .chev{width:15px; height:15px; color:var(--muted); transition:transform .18s ease; flex:none;}
.dayacc.open .day-head .chev{transform:rotate(90deg);}
.day-body{max-height:0; overflow:hidden; transition:max-height .22s ease;}
.dayacc.open .day-body{max-height:none;}

.exrow{border:1px solid var(--border); border-radius:13px; padding:11px 12px; background:var(--raised); margin-bottom:8px;}
.exrow .exname{font-weight:700; font-size:14px;}
.exrow .exmeta{font-size:12px; color:var(--muted); margin-top:2px;}
.setgrid{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.setpair{display:flex; align-items:center; gap:4px; background:var(--surface-2); border-radius:10px; padding:5px 6px;}
.setpair .slabel{font-size:10px; font-weight:700; color:var(--muted); width:14px; text-align:center;}
.setpair input{
  width:38px; text-align:center; border:1px solid var(--border); border-radius:7px; background:var(--surface);
  color:var(--ink); font:inherit; font-size:13px; font-variant-numeric:tabular-nums; padding:5px 2px;
}
.setpair input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent;}
.setpair .x{font-size:10px; color:var(--muted);}
.exfoot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; flex-wrap:wrap;}
.badges{display:flex; gap:6px; flex-wrap:wrap;}
.badge{font-size:11px; font-weight:700; padding:4px 8px; border-radius:8px; background:var(--surface-2); color:var(--ink-2); font-variant-numeric:tabular-nums;}
.badge.accent{background:color-mix(in srgb, var(--accent) 16%, var(--surface-2)); color:var(--accent);}
.rirfield{display:flex; align-items:center; gap:5px;}
.rirfield label{font-size:11px; color:var(--muted); font-weight:600;}
.rirfield input{width:34px; text-align:center; border:1px solid var(--border); border-radius:7px; background:var(--surface); color:var(--ink); font:inherit; font-size:13px; padding:5px 2px;}
.noterow{margin-top:8px;}
.noterow input{
  width:100%; border:1px solid var(--border); border-radius:9px; background:var(--surface);
  color:var(--ink); font:inherit; font-size:12.5px; padding:7px 9px;
}
.noterow input::placeholder{color:var(--muted);}

.runcard{border:1px solid var(--border); border-radius:14px; padding:12px 13px; background:var(--raised); margin-bottom:9px;}
.runhead{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.runhead .rtype{font-weight:700; font-size:14px;}
.runhead .rday{font-size:11.5px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums;}
.runhead .rpres{font-size:12.5px; color:var(--ink-2); margin-top:2px;}
.rungrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; margin-top:11px;}
.rungrid .full{grid-column:1/-1;}
.field{display:flex; flex-direction:column; gap:4px; min-width:0;}
.field label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted);}
.field input, .field select{
  width:100%; min-width:0; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--ink);
  font:inherit; font-size:13px; padding:7px 8px; font-variant-numeric:tabular-nums;
}
.kneewrap{display:flex; align-items:center; gap:8px; min-width:0;}
.kneewrap select{flex:1; min-width:0;}
.kneechip{width:28px; height:28px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; color:#fff;}

.phaseband{display:flex; flex-direction:column; gap:9px;}
.phasecard{border:1px solid var(--border); border-radius:13px; padding:11px 12px; background:var(--raised);}
.phasecard .ph{font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.03em;}
.phasecard .pt{font-weight:700; font-size:13.5px; margin-top:3px;}
.phasecard .pc{font-size:12.5px; color:var(--ink-2); margin-top:4px;}
.phasecard .pn{font-size:11.5px; color:var(--muted); margin-top:4px; font-style:italic;}

.recgrid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px;}
.rectile{border:1px solid var(--border); border-radius:12px; padding:9px 8px; background:var(--raised); text-align:center;}
.rectile .rw{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase;}
.rectile input{width:100%; text-align:center; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; font-size:12.5px; padding:5px 2px; margin-top:6px; font-variant-numeric:tabular-nums;}
.recnote{grid-column:1/-1; margin-top:2px;}
.recnote input{width:100%; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--ink); font:inherit; font-size:12.5px; padding:7px 9px;}

.bwrow{display:flex; align-items:center; gap:12px;}
.bwrow input{
  width:88px; font-size:22px; font-weight:800; text-align:center; border:1px solid var(--border);
  border-radius:12px; background:var(--surface); color:var(--accent); padding:9px 4px; font:inherit; font-variant-numeric:tabular-nums;
}
.bwrow .bwlabel{font-size:12.5px; color:var(--muted); font-weight:600; max-width:220px;}
table.macro{width:100%; border-collapse:collapse; margin-top:4px; font-size:13px;}
table.macro th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:700; padding:6px 4px; border-bottom:1px solid var(--border);}
table.macro td{padding:9px 4px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums;}
table.macro td:first-child{font-weight:600; color:var(--ink); font-variant-numeric:normal;}
table.macro td.range{font-weight:700; color:var(--accent); text-align:right;}
table.macro tr:last-child td{border-bottom:none;}
.suppcard{border:1px solid var(--border); border-radius:13px; padding:11px 12px; background:var(--raised); margin-bottom:8px;}
.suppcard .sn{font-weight:700; font-size:13.5px; display:flex; justify-content:space-between; gap:8px;}
.suppcard .sdose{color:var(--accent); font-weight:700; font-size:12.5px; font-variant-numeric:tabular-nums;}
.suppcard .swhen{font-size:11.5px; color:var(--muted); margin-top:2px; font-weight:600;}
.suppcard .snote{font-size:12.5px; color:var(--ink-2); margin-top:5px;}
.callout{border:1px dashed var(--border); border-radius:12px; padding:10px 12px; font-size:12.5px; color:var(--ink-2); background:var(--surface-2);}

.metrictoggle{display:flex; background:var(--surface-2); border-radius:11px; padding:3px; gap:3px; margin-bottom:14px; position:sticky; top:calc(64px + env(safe-area-inset-top)); z-index:5;}
.metrictoggle button{flex:1; border:none; background:none; padding:8px 4px; border-radius:8px; font:inherit; font-size:12.5px; font-weight:700; color:var(--muted);}
.metrictoggle button.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow);}
.chartcard{border:1px solid var(--border); border-radius:15px; padding:13px 14px 10px; background:var(--surface); margin-bottom:10px; box-shadow:var(--shadow);}
.chartcard .cthead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.chartcard .clift{font-weight:700; font-size:13.5px;}
.chartcard .cunit{font-size:11px; color:var(--muted); font-weight:600;}
.barsvg{display:block; width:100%; height:74px;}
.barsvg .base{stroke:var(--border); stroke-width:1;}
.barsvg .bar{fill:var(--accent); opacity:.55;}
.barsvg .bar.last{opacity:1;}
.barsvg text{font-size:9.5px; fill:var(--muted); font-family:inherit; font-variant-numeric:tabular-nums;}
.barsvg text.val{fill:var(--ink); font-weight:700; font-size:10.5px;}
.barsvg text.wk{font-weight:600;}
.progress-empty{font-size:12px; color:var(--muted); margin-top:6px;}
.progress-hint{font-size:12.5px; color:var(--ink-2); margin-bottom:14px;}

a{color:var(--accent);}
::selection{background:color-mix(in srgb, var(--accent) 30%, transparent);}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

function storageTest(){
  try{
    var k = '__storage_test__';
    localStorage.setItem(k, '1');
    var ok = localStorage.getItem(k) === '1';
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}
var STORAGE_OK = storageTest();

function loadState(){
  if(!STORAGE_OK) return {};
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
var state = loadState();
state.log = state.log || {};
state.runs = state.runs || {};
state.recovery = state.recovery || {};
if(typeof state.bodyweight !== 'number') state.bodyweight = DATA.bodyweight;
if(typeof state.metric !== 'string') state.metric = 'top';

var lastSavedAt = (STORAGE_OK && localStorage.getItem(STORE_KEY)) ? new Date() : null;
var saveTimer = null;
function persistToStorage(){
  if(!STORAGE_OK) return false;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; }catch(e){ return false; }
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    if(persistToStorage()){ lastSavedAt = new Date(); updateSavedStamp(); }
  }, 150);
}

function showToast(msg, ms){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.hidden = false;
  requestAnimationFrame(function(){ t.classList.add('show'); });
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){
    t.classList.remove('show');
    setTimeout(function(){ t.hidden = true; }, 220);
  }, ms || 2200);
}

function downloadBackup(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});

  var a = document.createElement('a');
  var stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = '5-week-plan-backup-'+stamp+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function saveNow(){
  clearTimeout(saveTimer);
  var btn = document.getElementById('saveBtn');
  var ok = persistToStorage();

    lastSavedAt = new Date();

    setTimeout(function(){ btn.classList.remove('failed'); }, 1600);
  }
  updateSavedStamp();
}

function importBackup(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      state.log = data.log || {};
      state.runs = data.runs || {};
      state.recovery = data.recovery || {};
      if(typeof data.bodyweight === 'number') state.bodyweight = data.bodyweight;
      if(typeof data.metric === 'string') state.metric = data.metric;
      persistToStorage();
      lastSavedAt = new Date();
      renderAll();
      showToast('Backup restored');
    }catch(e){
      showToast('Could not read that backup file');
    }
  };
  reader.readAsText(file);
}

function updateSavedStamp(){
  var el = document.getElementById('savedStamp');
  if(!el) return;
  if(!STORAGE_OK){
    el.textContent = 'On-device storage is unavailable in this view — use Save to download a backup, and Import to restore it.';

    el.textContent = 'Last saved ' + lastSavedAt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  } else {
    el.textContent = 'Not saved yet — changes autosave, or tap Save above.';
  }
}

  {n:5, start:'2026-08-11', end:'2026-08-17'}
];
function currentWeek(){
  var now = new Date();
  for(var i=0;i<WEEK_RANGES.length;i++){
    var r = WEEK_RANGES[i];
    if(now <= new Date(r.end+'T23:59:59')) return r.n;
  }
  return 5;
}

/* ---------- log helpers ---------- */
function logEntry(row){
  var id = 'w'+weekNum(row.week)+'-'+slug(row.day)+'-'+slug(row.exercise);
  if(!state.log[id]) state.log[id] = {sets:[], rir:'', notes:''};
  return {id:id, data:state.log[id]};
}
function computeTop(entryData){
  var top = 0;
  (entryData.sets||[]).forEach(function(s){
    var kg = parseFloat(s && s.kg); var reps = parseFloat(s && s.reps);
    if(!isNaN(kg) && kg>0 && !isNaN(reps) && reps>0 && kg>top) top = kg;
  });
  return top;
}
function computeVol(entryData){
  var vol = 0;
  (entryData.sets||[]).forEach(function(s){
    var kg = parseFloat(s && s.kg); var reps = parseFloat(s && s.reps);
    if(!isNaN(kg) && kg>0 && !isNaN(reps) && reps>0) vol += kg*reps;
  });
  return vol;
}

/* ---------- Progress ---------- */
var LOWER_LIFTS = ['Back squat (or box/trap-bar)','Romanian deadlift','Bulgarian / split-stance squat','Hip thrust (or SL hip thrust)','Trap-bar deadlift (or leg press)'];
var UPPER_LIFTS = ['Bench press (barbell or DB)','Pendlay row','Overhead press','Pull-up / lat pulldown'];

function liftSeries(name, metric){
  var vals = [];
  for(var w=1; w<=5; w++){
    var row = DATA.log.filter(function(r){ return weekNum(r.week)===w && r.exercise===name; })[0];
    if(!row){ vals.push(0); continue; }
    var ent = logEntry(row);
    vals.push(metric==='top' ? computeTop(ent.data) : computeVol(ent.data));
  }
  return vals;
}
function barChartSvg(vals){
  var w = 300, h = 74, pad = 4, gap = 8;
  var n = vals.length;
  var barW = (w - pad*2 - gap*(n-1)) / n;
  var max = Math.max.apply(null, vals);
  var hasData = max > 0;
  max = hasData ? max*1.15 : 1;
  var baseY = h - 16;
  var lastDataIdx = -1;
  for(var i=0;i<n;i++){ if(vals[i]>0) lastDataIdx = i; }
  var s = '<svg class="barsvg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  s += '<line class="base" x1="'+pad+'" y1="'+baseY+'" x2="'+(w-pad)+'" y2="'+baseY+'"/>';
  for(var i=0;i<n;i++){
    var x = pad + i*(barW+gap);
    var bh = hasData ? (vals[i]/max)*(baseY-14) : 0;
    var y = baseY - bh;
    var isLast = i===lastDataIdx;
    if(bh>0){
      s += '<rect class="bar'+(isLast?' last':'')+'" x="'+x+'" y="'+y+'" width="'+barW+'" height="'+Math.max(bh,3)+'" rx="4"/>';
    } else {
      s += '<line x1="'+x+'" y1="'+baseY+'" x2="'+(x+barW)+'" y2="'+baseY+'" stroke="var(--border)" stroke-width="2" stroke-dasharray="2,2"/>';
    }
    if(isLast && vals[i]>0) s += '<text class="val" x="'+(x+barW/2)+'" y="'+(y-5)+'" text-anchor="middle">'+Math.round(vals[i]).toLocaleString()+'</text>';
    s += '<text class="wk" x="'+(x+barW/2)+'" y="'+(h-3)+'" text-anchor="middle">W'+(i+1)+'</text>';
  }
  s += '</svg>';
  return s;
}
function renderProgress(){
  var metric = state.metric;
  var html = '';
  html += '<div class="metrictoggle" id="metricToggle">'+
    '<button data-metric="top" class="'+(metric==='top'?'active':'')+'">Top-set load</button>'+
    '<button data-metric="vol" class="'+(metric==='vol'?'active':'')+'">Volume</button></div>';
  html += '<div class="progress-hint">Auto-pulled from every set you log. Week 5 is a deload, so a dip there is expected.</div>';

  html += '<h2 class="eyebrow">Lower body</h2>';
  LOWER_LIFTS.forEach(function(name){ html += chartCard(name, liftSeries(name, metric), metric); });
  html += '<h2 class="eyebrow">Upper body</h2>';
  UPPER_LIFTS.forEach(function(name){ html += chartCard(name, liftSeries(name, metric), metric); });
  return html;
}
function chartCard(name, vals, metric){
  var unit = metric==='top' ? 'kg · top set' : 'kg · Σ load×reps';
  var hasData = Math.max.apply(null, vals) > 0;
  var html = '<div class="chartcard"><div class="cthead"><span class="clift">'+esc(name)+'</span><span class="cunit">'+unit+'</span></div>';
  html += barChartSvg(vals);
  if(!hasData) html += '<div class="progress-empty">Log sets in the Log tab to see this chart fill in.</div>';
  html += '</div>';
  return html;
}

/* ---------- wiring ---------- */
function wireTab(){
  var c = document.getElementById('content');

  Array.prototype.forEach.call(c.querySelectorAll('[data-acctoggle]'), function(btn){
    btn.addEventListener('click', function(){
      var key = btn.getAttribute('data-acctoggle');
      var acc = c.querySelector('[data-acc="'+key+'"]');
      var willOpen = !acc.classList.contains('open');
      acc.classList.toggle('open', willOpen);
      openState[key] = willOpen;
    });
  });

  Array.prototype.forEach.call(c.querySelectorAll('.exrow'), function(row){
    var id = row.getAttribute('data-exid');
    var ent = state.log[id];
    Array.prototype.forEach.call(row.querySelectorAll('[data-role="kg"],[data-role="reps"]'), function(inp){
      inp.addEventListener('input', function(){
        var idx = parseInt(inp.getAttribute('data-idx'),10);
        ent.sets[idx] = ent.sets[idx] || {};
        ent.sets[idx][inp.getAttribute('data-role')] = inp.value;
        var top = computeTop(ent), vol = computeVol(ent);
        row.querySelector('.badge.accent').textContent = 'Top '+(top>0?top+' kg':'—');
        row.querySelector('.badge:not(.accent)').textContent = 'Vol '+(vol>0?vol.toLocaleString():'—');
        save();
      });
    });
    var rirInp = row.querySelector('[data-role="rir"]');
    if(rirInp) rirInp.addEventListener('input', function(){ ent.rir = rirInp.value; save(); });
    var noteInp = row.querySelector('[data-role="notes"]');
    if(noteInp) noteInp.addEventListener('input', function(){ ent.notes = noteInp.value; save(); });
  });

  Array.prototype.forEach.call(c.querySelectorAll('.runcard'), function(card){
    var id = card.getAttribute('data-runid');
    var ent = state.runs[id];
    Array.prototype.forEach.call(card.querySelectorAll('[data-role]'), function(inp){
      var role = inp.getAttribute('data-role');
      inp.addEventListener('input', function(){
        ent[role] = inp.value;
        if(role==='knee'){
          var kc = kneeColor(ent.knee);
          var wrap = card.querySelector('.kneewrap');
          var chip = wrap.querySelector('.kneechip');
          if(kc){
            if(!chip){ chip = document.createElement('span'); chip.className='kneechip'; wrap.appendChild(chip); }
            chip.style.background = kc; chip.textContent = ent.knee;
          } else if(chip){ chip.remove(); }
        }
        save();
      });
      if(inp.tagName==='SELECT') inp.addEventListener('change', function(){ ent[role]=inp.value; inp.dispatchEvent(new Event('input')); });
    });
  });

  Array.prototype.forEach.call(c.querySelectorAll('[data-recwk]'), function(tile){
    var wn = tile.getAttribute('data-recwk');
    var rec = state.recovery[wn];
    var inp = tile.querySelector('[data-role]');
    if(inp) inp.addEventListener('input', function(){ rec[inp.getAttribute('data-role')] = inp.value; save(); });
  });

  var bwInput = document.getElementById('bwInput');
  if(bwInput){
    renderMacroBody();
    bwInput.addEventListener('input', function(){
      var v = parseFloat(bwInput.value);
      state.bodyweight = isNaN(v) ? 0 : v;
      renderMacroBody();
      save();
    });
  }

  var toggle = document.getElementById('metricToggle');
  if(toggle){
    Array.prototype.forEach.call(toggle.querySelectorAll('button'), function(btn){
      btn.addEventListener('click', function(){
        state.metric = btn.getAttribute('data-metric');
        save();
        renderAll();
      });
    });
  }

  var exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', function(){ downloadBackup(); showToast('Backup downloaded'); });
  var importBtn = document.getElementById('importBtn');
  if(importBtn) importBtn.addEventListener('click', function(){ document.getElementById('importFile').click(); });

  updateSavedStamp();
}

document.getElementById('saveBtn').addEventListener('click', saveNow);
document.getElementById('importFile').addEventListener('change', function(e){
  var file = e.target.files && e.target.files[0];
  if(file) importBackup(file);
  e.target.value = '';
});
if(!STORAGE_OK){
  var banner = document.getElementById('storageBanner');
  if(banner) banner.hidden = false;
}

renderAll();
})();
</script>
